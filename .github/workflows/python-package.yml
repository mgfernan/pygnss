name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PYGNSS_GITHUB_TOKEN }}
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt update
        sudo apt install -y build-essential
        pip install -v .[test]

    - name: Lint with flake8
      run: flake8 roktools --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821

    - name: Build wheel
      run: |
        pip wheel -v --no-deps .

    - name: Test with pytest
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install roktools-*.whl
        pytest -v


  tag:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # To fetch the tags
          token: ${{ secrets.PYGNSS_GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release dependenceies
        run: python -m pip install .[release]

      - name: Semantic Release
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          semantic-release version
        env:
          # This is required to create a commit in the repo
          GH_TOKEN: ${{secrets.PYGNSS_GITHUB_TOKEN}}
