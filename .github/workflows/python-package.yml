name: Python package

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]


jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PYGNSS_GITHUB_TOKEN }}
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create and activate venv, install dependencies
      run: |
        python -m venv .venv
        # shellcheck disable=SC1091
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'

    - name: Lint with flake8
      run: |
        # Use the venv's flake8 (installed as part of the test extras)
        .venv/bin/flake8 pygnss --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821

    - name: Test with pytest
      run: |
        # Run pytest using the venv's interpreter so installed deps are visible
        export PATH="${{ github.workspace }}/.venv/bin:$PATH"
        pytest -v


  tag:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # To fetch the tags
          token: ${{ secrets.PYGNSS_GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release dependenceies
        run: python -m pip install .[release]

      - name: Semantic Release
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          semantic-release version
        env:
          # This is required to create a commit in the repo
          GH_TOKEN: ${{secrets.PYGNSS_GITHUB_TOKEN}}
